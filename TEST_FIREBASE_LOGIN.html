<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Login Test - Lakshana Bridal Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FAF9F6 0%, #F5F0E8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            color: #C9A96E;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #C9A96E;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }
        
        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }
        
        .config-check {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .config-check h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .config-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }
        
        .config-item:last-child {
            border-bottom: none;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-badge.ok {
            background: #d4edda;
            color: #155724;
        }
        
        .status-badge.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Firebase Login Test</h1>
        <p class="subtitle">Lakshana Bridal Studio - Admin Authentication</p>
        
        <div class="config-check">
            <h3>Firebase Configuration Status</h3>
            <div class="config-item">
                <span>API Key:</span>
                <span class="status-badge" id="apiKeyStatus">Checking...</span>
            </div>
            <div class="config-item">
                <span>Auth Domain:</span>
                <span class="status-badge" id="authDomainStatus">Checking...</span>
            </div>
            <div class="config-item">
                <span>Project ID:</span>
                <span class="status-badge" id="projectIdStatus">Checking...</span>
            </div>
            <div class="config-item">
                <span>Firebase Initialized:</span>
                <span class="status-badge" id="initStatus">Checking...</span>
            </div>
        </div>
        
        <form id="loginForm" style="margin-top: 30px;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" value="sureshkathirvel601@gmail.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" value="Adminlaks123@" required>
            </div>
            
            <button type="submit" id="submitBtn">Test Firebase Login</button>
        </form>
        
        <div class="result" id="result"></div>
    </div>
    
    <script type="module">
        // Firebase configuration (hardcoded for testing)
        const firebaseConfig = {
            apiKey: "AIzaSyCgdbZk6MU5gdCbyeUUX33TkQkycbZo6BM",
            authDomain: "lakshanaatelier.firebaseapp.com",
            projectId: "lakshanaatelier",
            storageBucket: "lakshanaatelier.firebasestorage.app",
            messagingSenderId: "905891434766",
            appId: "1:905891434766:web:3faf870cd5d2af53a6075f"
        };
        
        // Check configuration
        function updateConfigStatus() {
            const apiKeyEl = document.getElementById('apiKeyStatus');
            const authDomainEl = document.getElementById('authDomainStatus');
            const projectIdEl = document.getElementById('projectIdStatus');
            
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== '') {
                apiKeyEl.textContent = '✓ OK';
                apiKeyEl.className = 'status-badge ok';
            } else {
                apiKeyEl.textContent = '✗ Missing';
                apiKeyEl.className = 'status-badge error';
            }
            
            if (firebaseConfig.authDomain && firebaseConfig.authDomain !== '') {
                authDomainEl.textContent = '✓ OK';
                authDomainEl.className = 'status-badge ok';
            } else {
                authDomainEl.textContent = '✗ Missing';
                authDomainEl.className = 'status-badge error';
            }
            
            if (firebaseConfig.projectId && firebaseConfig.projectId !== '') {
                projectIdEl.textContent = '✓ OK';
                projectIdEl.className = 'status-badge ok';
            } else {
                projectIdEl.textContent = '✗ Missing';
                projectIdEl.className = 'status-badge error';
            }
        }
        
        // Initialize Firebase
        async function initFirebase() {
            const initStatusEl = document.getElementById('initStatus');
            
            try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
                const { getAuth, signInWithEmailAndPassword } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                
                initStatusEl.textContent = '✓ Initialized';
                initStatusEl.className = 'status-badge ok';
                
                console.log('✅ Firebase initialized successfully');
                
                return { auth, signInWithEmailAndPassword };
            } catch (error) {
                initStatusEl.textContent = '✗ Failed';
                initStatusEl.className = 'status-badge error';
                
                console.error('❌ Firebase initialization failed:', error);
                throw error;
            }
        }
        
        // Handle form submission
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Testing...';
            resultDiv.style.display = 'none';
            
            try {
                const { auth, signInWithEmailAndPassword } = await initFirebase();
                
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `
                    <h4 style="margin-bottom: 10px;">✅ Login Successful!</h4>
                    <p><strong>User ID:</strong> <code>${user.uid}</code></p>
                    <p><strong>Email:</strong> <code>${user.email}</code></p>
                    <p><strong>Email Verified:</strong> ${user.emailVerified ? 'Yes' : 'No'}</p>
                    <p style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #c3e6cb;">
                        <strong>Result:</strong> Firebase Authentication is working correctly! 
                        You can now login to your admin panel at 
                        <a href="https://lakshanaatelier.in/admin/login" target="_blank">lakshanaatelier.in/admin/login</a>
                    </p>
                `;
                
                console.log('✅ Login successful:', user);
                
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h4 style="margin-bottom: 10px;">❌ Login Failed</h4>
                    <p><strong>Error Code:</strong> <code>${error.code}</code></p>
                    <p><strong>Error Message:</strong> ${error.message}</p>
                    <p style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #f5c6cb;">
                        <strong>Troubleshooting:</strong><br>
                        ${error.code === 'auth/invalid-credential' ? 
                            '- Check if the user exists in Firebase Authentication<br>- Verify the password is correct' : 
                            error.code === 'auth/api-key-not-valid' ?
                            '- Firebase API key is invalid or not loaded<br>- Check Vercel environment variables' :
                            error.code === 'auth/user-not-found' ?
                            '- User does not exist in Firebase Authentication<br>- Create the user first' :
                            '- Check browser console for more details<br>- Verify Firebase configuration'
                        }
                    </p>
                `;
                
                console.error('❌ Login failed:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Test Firebase Login';
            }
        }
        
        // Initialize
        updateConfigStatus();
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    </script>
</body>
</html>
