<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin User - Lakshana</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #C9A96E;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #C9A96E;
        }
        
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #C9A96E 0%, #B8956A 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
            font-size: 14px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #C9A96E;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .info-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #856404;
        }
        
        .credentials {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: monospace;
        }
        
        .credentials p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Create Admin User</h1>
        <p class="subtitle">Lakshana Bridal Studio - Firebase Setup</p>
        
        <div class="info-box">
            <strong>⚠️ Important:</strong> This will create an admin user in Firebase Authentication and Firestore database.
            <br><br>
            <strong>💡 Suggested Credentials:</strong><br>
            Email: <code>sureshhkathirvel601@gmail.com</code><br>
            Password: <code>Admin123@</code>
        </div>
        
        <form id="createAdminForm">
            <div class="form-group">
                <label for="email">Admin Email *</label>
                <input type="email" id="email" placeholder="admin@lakshana.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password * (min 6 characters)</label>
                <input type="password" id="password" placeholder="Enter secure password" required minlength="6">
            </div>
            
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" placeholder="Admin Name" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="+91 98765 43210">
            </div>
            
            <button type="submit" id="submitBtn">Create Admin User</button>
        </form>
        
        <div id="status" class="status"></div>
    </div>

    <script type="module">
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCgdbZk6MU5gdCbyeUUX33TkQkycbZo6BM",
            authDomain: "lakshanaatelier.firebaseapp.com",
            projectId: "lakshanaatelier",
            storageBucket: "lakshanaatelier.firebasestorage.app",
            messagingSenderId: "905891434766",
            appId: "1:905891434766:web:3faf870cd5d2af53a6075f"
        };

        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const form = document.getElementById('createAdminForm');
        const statusDiv = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Creating Admin User...';
            showStatus('Creating admin user...', 'info');

            try {
                // Step 1: Create user in Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                console.log('✅ User created in Authentication:', user.uid);

                // Step 2: Create admin document in Firestore
                const adminData = {
                    authId: user.uid,
                    email: email,
                    fullName: fullName,
                    phone: phone || null,
                    role: 'super_admin',
                    status: 'active',
                    designation: 'Super Administrator',
                    department: 'Management',
                    permissions: {
                        dashboard: { view: true, edit: true },
                        bookings: { view: true, edit: true, delete: true },
                        customers: { view: true, edit: true, delete: true },
                        services: { view: true, edit: true, delete: true },
                        gallery: { view: true, edit: true, delete: true },
                        testimonials: { view: true, edit: true, delete: true },
                        staff: { view: true, edit: true, delete: true },
                        settings: { view: true, edit: true },
                        reports: { view: true, export: true }
                    },
                    createdAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    lastLogin: null
                };

                await setDoc(doc(db, 'admins', user.uid), adminData);

                console.log('✅ Admin document created in Firestore');

                // Success!
                showStatus('✅ Admin user created successfully!', 'success');
                
                // Show credentials
                const credentialsHTML = `
                    <div class="credentials">
                        <strong>✅ Login Credentials:</strong>
                        <p>📧 Email: ${email}</p>
                        <p>🔑 Password: ${password}</p>
                        <p>👤 Role: Super Admin</p>
                        <br>
                        <strong>Use these credentials to login at:</strong>
                        <p>🌐 https://lakshanaatelier.in/admin/login</p>
                    </div>
                `;
                
                statusDiv.innerHTML = '✅ Admin user created successfully!' + credentialsHTML;
                form.reset();

            } catch (error) {
                console.error('❌ Error:', error);
                let errorMessage = 'Error: ' + error.message;
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = '❌ This email is already registered. Try a different email or use existing credentials.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = '❌ Password is too weak. Use at least 6 characters.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = '❌ Invalid email address format.';
                }
                
                showStatus(errorMessage, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Create Admin User';
            }
        });
    </script>
</body>
</html>
