<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Supabase Connection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0d0d0d;
            color: #f8f5f0;
        }
        .test-box {
            background: #1a1a1a;
            border: 2px solid #d4af37;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .success { color: #4ade80; }
        .error { color: #ef4444; }
        button {
            background: #d4af37;
            color: #0d0d0d;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 10px 5px;
        }
        button:hover {
            background: #c49b2d;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #0d0d0d;
            border: 1px solid #d4af37;
            color: #f8f5f0;
            border-radius: 4px;
        }
        label {
            display: block;
            margin-top: 10px;
            color: #d4af37;
        }
    </style>
</head>
<body>
    <h1>🧪 Supabase Connection Test</h1>
    <p>This page will test your Supabase connection and booking system</p>

    <!-- TEST 1: Connection Test -->
    <div class="test-box">
        <h2>Test 1: Check Supabase Connection</h2>
        <button onclick="testConnection()">Test Connection</button>
        <div id="connectionResult"></div>
    </div>

    <!-- TEST 2: View Services -->
    <div class="test-box">
        <h2>Test 2: Load Services</h2>
        <button onclick="testServices()">Load Services</button>
        <div id="servicesResult"></div>
    </div>

    <!-- TEST 3: Create Booking -->
    <div class="test-box">
        <h2>Test 3: Create Test Booking</h2>
        <form id="bookingForm" onsubmit="testBooking(event)">
            <label>Name:</label>
            <input type="text" id="name" value="Test User" required>
            
            <label>Phone:</label>
            <input type="tel" id="phone" value="9876543210" required>
            
            <label>Email:</label>
            <input type="email" id="email" value="test@test.com">
            
            <label>Service:</label>
            <select id="service" required>
                <option value="Bridal Makeup">Bridal Makeup</option>
                <option value="Reception">Reception</option>
                <option value="Engagement">Engagement</option>
            </select>
            
            <label>Date:</label>
            <input type="date" id="date" required>
            
            <label>Message:</label>
            <input type="text" id="message" value="Test booking">
            
            <button type="submit">Submit Test Booking</button>
        </form>
        <div id="bookingResult"></div>
    </div>

    <script>
        // Initialize Supabase
        const SUPABASE_URL = 'https://lhqwuycqjzsmkvwllvzx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxocXd1eWNxanpzbWt2d2xsdnp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDIwNTIsImV4cCI6MjA5ODU3ODA1Mn0.U6HbYC1xSYa6iJgS0fuhdmRIw1YMzgSF_HrRqLACsE0';
        
        const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function testConnection() {
            const result = document.getElementById('connectionResult');
            result.innerHTML = '<p>Testing connection...</p>';
            
            try {
                // Try to query a table
                const { data, error } = await supabase
                    .from('service_categories')
                    .select('count');
                
                if (error) {
                    result.innerHTML = `<p class="error">❌ Connection failed: ${error.message}</p>`;
                    console.error('Connection error:', error);
                } else {
                    result.innerHTML = `<p class="success">✅ Connection successful!</p>`;
                    console.log('Connection test passed:', data);
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                console.error('Exception:', error);
            }
        }

        async function testServices() {
            const result = document.getElementById('servicesResult');
            result.innerHTML = '<p>Loading services...</p>';
            
            try {
                const { data, error } = await supabase
                    .from('services')
                    .select('id, name, price, is_active')
                    .eq('is_active', true)
                    .limit(5);
                
                if (error) {
                    result.innerHTML = `<p class="error">❌ Failed: ${error.message}</p>`;
                    console.error('Services error:', error);
                } else {
                    result.innerHTML = `
                        <p class="success">✅ Loaded ${data.length} services:</p>
                        <ul>
                            ${data.map(s => `<li>${s.name} - ₹${s.price}</li>`).join('')}
                        </ul>
                    `;
                    console.log('Services loaded:', data);
                }
            } catch (error) {
                result.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
                console.error('Exception:', error);
            }
        }

        async function testBooking(event) {
            event.preventDefault();
            
            const result = document.getElementById('bookingResult');
            result.innerHTML = '<p>Creating booking...</p>';
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const service = document.getElementById('service').value;
            const date = document.getElementById('date').value;
            const message = document.getElementById('message').value;
            
            try {
                // Step 1: Create customer
                console.log('Step 1: Creating customer...');
                const { data: existingCustomer } = await supabase
                    .from('customers')
                    .select('id')
                    .eq('phone', phone)
                    .single();
                
                let customerId;
                if (existingCustomer) {
                    customerId = existingCustomer.id;
                    console.log('Customer exists:', customerId);
                } else {
                    const { data: newCustomer, error: customerError } = await supabase
                        .from('customers')
                        .insert([{
                            full_name: name,
                            phone: phone,
                            email: email || null,
                            status: 'active'
                        }])
                        .select('id')
                        .single();
                    
                    if (customerError) {
                        throw customerError;
                    }
                    customerId = newCustomer.id;
                    console.log('Customer created:', customerId);
                }
                
                // Step 2: Get service ID
                console.log('Step 2: Getting service...');
                const { data: serviceData } = await supabase
                    .from('services')
                    .select('id, price')
                    .eq('name', service)
                    .eq('is_active', true)
                    .single();
                
                console.log('Service found:', serviceData);
                
                // Step 3: Create appointment
                console.log('Step 3: Creating appointment...');
                const { data: appointment, error: appointmentError } = await supabase
                    .from('appointments')
                    .insert([{
                        customer_id: customerId,
                        service_id: serviceData?.id || null,
                        appointment_date: date,
                        appointment_time: '10:00:00',
                        status: 'pending',
                        customer_notes: message,
                        total_amount: 0,
                        discount_amount: 0,
                        paid_amount: 0,
                        payment_status: 'pending'
                    }])
                    .select('*, booking_reference')
                    .single();
                
                if (appointmentError) {
                    throw appointmentError;
                }
                
                result.innerHTML = `
                    <p class="success">✅ Booking created successfully!</p>
                    <p><strong>Reference:</strong> ${appointment.booking_reference}</p>
                    <p><strong>Customer ID:</strong> ${customerId}</p>
                    <p><strong>Appointment ID:</strong> ${appointment.id}</p>
                `;
                console.log('Booking complete:', appointment);
                
            } catch (error) {
                result.innerHTML = `
                    <p class="error">❌ Booking failed: ${error.message}</p>
                    <p>Code: ${error.code}</p>
                    <p>Details: ${JSON.stringify(error.details || {})}</p>
                `;
                console.error('Booking error:', error);
            }
        }

        // Set today's date as minimum
        document.getElementById('date').min = new Date().toISOString().split('T')[0];
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
